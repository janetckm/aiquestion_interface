<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Without AI - Question Study</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="page-study page-noai">

<header class="topbar">
  <a class="brand" href="index.html">← Question Study</a>
  <span class="spacer"></span>
  <span class="progress" id="progress">Step 1 of 2</span>
</header>

<main class="wrap">

  <section class="step is-active" data-step="demographics">
    <h2 class="step-title">Tell us about you</h2>
    <p class="step-hint">These details are only used for the study record.</p>
    <div class="card">
      <div id="demographics"></div>
    </div>
  </section>

  <section class="step" data-step="questions">
    <h2 class="step-title">Questions</h2>
    <p class="step-hint">Type your answer, or press “I don’t know” if you are not sure. There is no wrong answer.</p>
    <div id="questions"></div>
    <div style="margin:18px 0 6px">
      <button type="button" class="btn btn-primary" id="btn-submit" hidden>Finish &amp; submit</button>
    </div>
  </section>

</main>

<footer class="bottombar">
  <button type="button" class="btn" id="btn-back" hidden>Back</button>
  <span class="spacer"></span>
  <span class="counter" id="counter"></span>
  <button type="button" class="btn btn-primary" id="btn-next">Next</button>
</footer>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/noai.js"></script>
</body>
</html>
